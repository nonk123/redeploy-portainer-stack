name: redeploy-portainer-stack
description: Redeploy a Portainer CE Web editor stack from GitHub Actions CI
author: nonk123

inputs:
  url:
    description: Your Portainer CE instance public URL, such as `https://portainer.example.org:9443`.
    required: true

  username:
    description: Username to log into your Portainer CE instance.
    required: true

  password:
    description: Password to log into your Portainer CE instance.
    required: true

runs:
  using: composite
  steps:
    - name: Parse stack URL
      shell: python
      id: parse
      env:
        TARGET_URL: ${{ inputs.url }}
      run: |
        import os
        import sys

        from urllib.parse import urlparse, parse_qs

        u = urlparse(os.environ["TARGET_URL"].strip())
        inner = urlparse(u.fragment.lstrip("!")) if u.fragment else u

        segments = [s for s in inner.path.split("/") if s]
        env_id = segments[0] if segments else ""

        params = parse_qs(inner.query) or parse_qs(u.query)
        stack_id = params.get("id", [""])[0]

        if u.scheme and u.netloc and env_id.isdigit() and stack_id.isdigit():
            url = f"{u.scheme}://{u.netloc}"
            print(f"::add-mask::{url}")

            with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                out.write(f"url={url}\n")
                out.write(f"env_id={env_id}\n")
                out.write(f"stack_id={stack_id}\n")
        else:
            print("::error::Invalid Portainer stack URL. Expected format: https://<host>/#!/<env_id>/docker/stacks/<name>?id=<stack_id>")
            sys.exit(1)

    - name: Log into the Portainer instance
      shell: bash
      run: |
        JWT_TOKEN=$(curl -sf -X POST \
          -H "Content-Type: application/json" \
          -d '{"username":"${{ inputs.username }}","password":"${{ inputs.password }}"}' \
          "${{ steps.parse.outputs.url }}/api/auth" | jq -r '.jwt')
        echo "::add-mask::$JWT_TOKEN"
        echo "JWT_TOKEN=$JWT_TOKEN" >> $GITHUB_ENV

    - name: Check stack access permissions
      shell: bash
      run: |
        code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $JWT_TOKEN" "${{ steps.parse.outputs.url }}/api/stacks/${{ steps.parse.outputs.stack_id }}")

        if [[ "$code" != 200 ]]; then
          echo "::error::Failed to access Portainer stack (HTTP code $code)"
          echo "::notice::Make sure the specified user has the necessary permissions to access the Portainer environment, the stack itself, and the container registries pulled from in the stack"
          exit 1
        fi

    - name: Fetch stack environment variables
      shell: bash
      run: |
        ENV_VALUE=$(curl -sf -H "Authorization: Bearer $JWT_TOKEN" \
          "${{ steps.parse.outputs.url }}/api/stacks/${{ steps.parse.outputs.stack_id }}" | jq -c .Env)
        echo "::add-mask::$ENV_VALUE"
        echo "ENV_VALUE=$ENV_VALUE" >> $GITHUB_ENV

    - name: Fetch stack YAML definition
      shell: bash
      run: |
        STACK_CONTENT=$(curl -sf -H "Authorization: Bearer $JWT_TOKEN" \
          "${{ steps.parse.outputs.url }}/api/stacks/${{ steps.parse.outputs.stack_id }}/file" | jq -c .StackFileContent)
        echo "::add-mask::$STACK_CONTENT"
        echo "STACK_CONTENT=$STACK_CONTENT" >> $GITHUB_ENV

    - name: Force Portainer CE stack update
      shell: bash
      run: |
        curl -sf -X PUT -o /dev/null \
          -H "Authorization: Bearer $JWT_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"stackFileContent\":$STACK_CONTENT,\"env\":$ENV_VALUE,\"prune\": true,\"pullImage\": true}" \
          "${{ steps.parse.outputs.url }}/api/stacks/${{ steps.parse.outputs.stack_id }}?endpointId=${{ steps.parse.outputs.env_id }}"
